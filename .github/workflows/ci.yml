name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.7"

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.11.19"
          enable-cache: true

      - name: Check that uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Install frozen dependencies
        run: uv sync --frozen --extra dev

      - name: Run ruff
        run: uv run ruff check .

      - name: Run agent static, schema, plugin, and generated-asset gates
        run: |
          uv run mypy tools/agents
          uv run python tools/agents/validate_json_schemas.py
          uv run python tools/agents/validate_plugins.py
          uv run python tools/agents/validate_registry.py
          uv run python tools/agents/check_generated.py
          uv run python tools/agents/sync_routes.py --check

      - name: Compile agent Python and check the generated shims
        run: |
          uv run python -m compileall -q src/pitwall/agents tests/agents tools/agents
          shims="$(mktemp -d)"
          uv run python tools/agents/write_shims.py "$shims"
          for script in "$shims"/scripts/*.sh; do bash -n "$script"; done

      - name: Run agent installation doctor and all shim sentinels
        run: |
          uv run python -m pitwall.agents doctor --installation-only --json >/dev/null
          shims="$(mktemp -d)"
          uv run python tools/agents/write_shims.py "$shims"
          for script in "$shims"/scripts/*.sh; do
            test "$(PATH="$shims/bin:$PATH" bash "$script" 2>&1 | tail -1)" = "SHIM-DONE exit=64"
          done

      - name: Run worker HF CLI guard
        run: uv run python tools/guards/deprecated_hf_cli.py

      - name: Enforce Python policy (type-ignore, noqa, and except reasons) over tracked files
        run: |
          git ls-files -z -- '*.py' \
            | xargs -0 -r -n 200 uv run python tools/guards/python_policy.py

      - name: Validate workflow trust policy
        run: |
          uv run python tools/ci/check_workflows.py
          uv run pytest -q -m release tests/release/test_workflows.py -p no:randomly -p no:cov

      - name: Enforce repository text policy over every tracked path
        run: |
          git ls-files -z \
            | xargs -0 -r -n 200 uv run python tools/guards/repo_text_policy.py

      - name: Check OpenAPI compatibility against the base revision
        env:
          PITWALL_OPENAPI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          uv run python tools/ci/export_openapi.py --output /tmp/openapi-candidate.json
          if test -n "$PITWALL_OPENAPI_BASE_SHA" && \
             git cat-file -e "$PITWALL_OPENAPI_BASE_SHA:docs/api/openapi-baseline.json"; then
            git show "$PITWALL_OPENAPI_BASE_SHA:docs/api/openapi-baseline.json" \
              > /tmp/openapi-baseline.json
          else
            cp docs/api/openapi-baseline.json /tmp/openapi-baseline.json
          fi
          uv run python tools/ci/check_openapi_compat.py \
            /tmp/openapi-baseline.json /tmp/openapi-candidate.json

      - name: Install and run Actionlint 1.7.12
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output /tmp/actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' \
            | sha256sum --check --strict
          tar --extract --gzip --file /tmp/actionlint.tar.gz --directory /tmp actionlint
          /tmp/actionlint

      - name: Enforce DCO sign-offs
        if: github.event_name == 'pull_request'
        env:
          PITWALL_DCO_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PITWALL_DCO_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run python tools/ci/check_dco.py

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.7"

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.11.19"
          enable-cache: true

      - name: Install frozen dependencies
        run: uv sync --frozen --extra dev

      - name: Run ruff format
        run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.7"

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.11.19"
          enable-cache: true

      - name: Install frozen dependencies
        run: uv sync --frozen --extra dev

      - name: Run mypy --strict
        run: uv run mypy --strict src/

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.7"

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.11.19"

      - name: Validate internal Markdown links and anchors
        run: uv run python tools/ci/check_markdown_links.py

      - name: Validate external Markdown links with retries
        if: github.event_name == 'schedule'
        run: uv run python tools/ci/check_markdown_links.py --external

  gateway-catalog-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.7"

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.11.19"

      - name: Install frozen dependencies
        run: uv sync --frozen --extra dev

      - name: Free-tier catalog drift gate
        run: uv run python tools/gateway/check_catalog_drift.py

  container-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, reconciler, webhook, cost-exporter, mcp]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build supported service image without publishing
        run: |
          docker build --platform linux/amd64 \
            --tag pitwall/${{ matrix.service }}:ci \
            --file docker/Dockerfile.${{ matrix.service }} .
          test "$(docker image inspect --format '{{.Config.User}}' \
            pitwall/${{ matrix.service }}:ci)" = "10001:10001"
          test "$(docker image inspect --format '{{if .Config.Healthcheck}}yes{{end}}' \
            pitwall/${{ matrix.service }}:ci)" = "yes"
          docker run --rm --entrypoint python \
            pitwall/${{ matrix.service }}:ci -c \
            'import importlib.util; assert importlib.util.find_spec("model_routing") is None'
          test -z "$(docker run --rm --entrypoint sh \
            pitwall/${{ matrix.service }}:ci -c \
            'find /app /usr/local -path "*model_routing*" 2>/dev/null')"

      - name: Scheduled fixed-vulnerability image scan
        if: github.event_name == 'schedule'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pitwall/${{ matrix.service }}:ci
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate canonical deployment configuration
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          RUNPOD_API_KEY: ci-runpod-key
          PITWALL_API_TOKEN: ci-api-token-00000001
          PITWALL_ADMIN_SECRET: ci-admin-secret-00000001
          PITWALL_WEBHOOK_SECRET: ci-webhook-secret-00000001
          PITWALL_WEBHOOK_ENCRYPTION_KEYS: '{"v1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}'
          PITWALL_ARCHIVE_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: docker compose config -q

  security-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.7"
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.11.19"
      - run: uv sync --frozen --all-extras
      - name: bandit (fail only on findings new vs baseline)
        run: |
          uv run bandit -c pyproject.toml -r src/pitwall -ll -ii \
            -b tools/security/bandit-baseline.json
      - name: pip-audit (locked dependencies)
        run: |
          audit_args=()
          while IFS= read -r vulnerability_id; do
            test -n "$vulnerability_id" && audit_args+=(--ignore-vuln "$vulnerability_id")
          done < <(sed -E 's/#.*//' tools/security/pip-audit-ignore.txt)
          uv run pip-audit -r \
            <(uv export --frozen --format requirements-txt --no-hashes) \
            "${audit_args[@]}"
      - name: Semgrep Python and security rules
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          uvx --from semgrep==1.165.0 semgrep scan --error \
            --config p/python --config p/security-audit \
            --exclude-rule python.lang.security.insecure-hash-algorithms-md5.insecure-hash-algorithm-md5 \
            --config tools/security/semgrep.yml src/pitwall
      - name: Dependency license policy (base runtime and images, extras, dev, Pi npm)
        run: |
          uv run python tools/security/check_licenses.py
          uv run python tools/security/check_licenses.py --extra storage --extra email --extra tracing
          uv run python tools/security/check_licenses.py --extra dev
          uv run python tools/security/check_licenses.py --npm-lock tools/pi-deps/package-lock.json

  security-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.7"
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.11.19"
      - run: uv sync --frozen --extra dev
      - name: detect-secrets (audit baseline up to date)
        run: |
          uv run python tools/security/check_secrets.py

  security-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.7"
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.11.19"
      - run: uv sync --frozen --extra dev
      - name: schemathesis fuzz of public and authenticated admin routes (no server errors on any input)
        run: uv run pytest -m "fuzz and not live" tests/security -p no:randomly -p no:cov -q

  mutation-smoke:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.11.19"
      - run: uv python install 3.14.7
      - run: uv sync --frozen --extra dev
      - name: mutmut core-trio score gate
        run: make mutation-gate

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14.7"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.11.19"
          enable-cache: true

      - name: Install frozen dependencies
        run: uv sync --frozen --extra dev

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.1"

      - name: Install the restricted-mode test dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          # The workbench tests exercise the actual user-namespace boundary.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install the pinned Pi packages the workbench tests and extension check load
        run: |
          npm ci --prefix tools/pi-deps --ignore-scripts
          echo "PITWALL_PI_MODULES=$GITHUB_WORKSPACE/tools/pi-deps/node_modules" >> "$GITHUB_ENV"

      - name: Run fast test suite with coverage gate (hermetic floor)
        # The one hermetic run of the CI run. Its coverage data file is kept for coverage-combined.
        env:
          COVERAGE_FILE: coverage-data/hermetic.coverage
        run: |
          mkdir -p coverage-data
          uv run pytest -n logical -m "not integration and not slow and not live" \
            --cov=src/pitwall --cov-report=term-missing --cov-fail-under=74

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-hermetic
          path: coverage-data/hermetic.coverage
          if-no-files-found: error
          retention-days: 7

      - name: Run the perf benchmarks serially (xdist disables pytest-benchmark)
        run: uv run pytest -m benchmark -p no:xdist -p no:randomly -q

      - name: Run property suite (thorough hypothesis profile)
        env:
          HYPOTHESIS_PROFILE: ci
        run: uv run pytest -m "property and not live" -p no:randomly

  pi-extensions:
    name: Pi extensions check
    # Pinned on purpose. The check recompiles the committed extension JavaScript and compares it
    # byte for byte, so the Node major and the runner image must not float with `latest`. The
    # restricted-mode tests need `setpriv --seccomp-filter` (util-linux 2.41+), which
    # ubuntu-latest (24.04, util-linux 2.39) lacks; on that image they skip and prove nothing.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.7"

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.11.19"
          enable-cache: true

      - name: Install frozen dependencies
        run: uv sync --frozen --extra dev

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.1"

      - name: Install the restricted-mode test dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          # The workbench tests exercise the actual user-namespace boundary.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install the pinned Pi packages the extension suites load
        run: |
          npm ci --prefix tools/pi-deps --ignore-scripts
          for package in @earendil-works/pi-ai @earendil-works/pi-coding-agent \
            @earendil-works/pi-tui @tintinweb/pi-subagents; do
            test -d "tools/pi-deps/node_modules/$package"
          done
          echo "PITWALL_PI_MODULES=$GITHUB_WORKSPACE/tools/pi-deps/node_modules" >> "$GITHUB_ENV"

      - name: Check the committed Pi extension JavaScript matches its TypeScript
        run: make pi-extensions-check

      - name: Run the Pi extension and restricted-mode suites; fail if the sandbox tests skip
        run: |
          uv run pytest tests/workbench/test_restricted.py tests/workbench/test_surfaces.py \
            tests/workbench/test_dynamic_contract_acceptance.py tests/workbench/pi_extensions \
            -p no:randomly -p no:cov -q -rs | tee "$RUNNER_TEMP/pytest.log"
          if grep -E '^SKIPPED .*(bubblewrap|setpriv|seccomp|sandbox|node)' "$RUNNER_TEMP/pytest.log"; then
            echo "::error::a restricted-mode or Pi extension test skipped on the pinned runner"
            exit 1
          fi

  agents-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.7"

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.11.19"
          enable-cache: true

      - name: Install portable test prerequisite
        run: brew install coreutils

      - name: Install frozen dependencies
        run: uv sync --frozen --extra dev --python 3.14.7

      - name: Run the portable agent runtime and source-install coverage
        env:
          HOME: ${{ runner.temp }}/agent-routing-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/agent-routing-home/config
          XDG_DATA_HOME: ${{ runner.temp }}/agent-routing-home/data
          XDG_STATE_HOME: ${{ runner.temp }}/agent-routing-home/state
          XDG_CACHE_HOME: ${{ runner.temp }}/agent-routing-home/cache
          TMPDIR: ${{ runner.temp }}/agent-routing-home/tmp
        run: |
          mkdir -p "$TMPDIR"
          uv run --frozen pytest tests/agents -m macos -n logical -q -p no:randomly -p no:cov
          uv run --frozen python -m pitwall.agents doctor --installation-only --json >/dev/null

  dependency-compatibility:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        resolution: [highest, lowest-direct]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.7"

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.11.19"

      - name: Resolve ${{ matrix.resolution }} compatible dependencies
        run: uv lock --upgrade --resolution "${{ matrix.resolution }}"

      - name: Install resolved dependencies
        # --frozen is essential here: without it, uv re-locks with its default
        # highest resolution and silently defeats the lowest-direct matrix row.
        run: uv sync --frozen --extra dev

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.1"

      - name: Install the pinned Pi packages the node suites load
        run: |
          npm ci --prefix tools/pi-deps --ignore-scripts
          echo "PITWALL_PI_MODULES=$GITHUB_WORKSPACE/tools/pi-deps/node_modules" >> "$GITHUB_ENV"

      - name: Run hermetic compatibility suite
        run: >-
          uv run --frozen pytest -n logical -m "not integration and not slow and not live"
          -p no:randomly -p no:cov

  integration:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: pitwall-ci-int-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.7"

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.11.19"
          enable-cache: true

      - name: Install frozen dependencies
        run: uv sync --frozen --extra dev

      - name: Start test infrastructure (Postgres + Redis)
        run: docker compose -f docker-compose.testinfra.yml up -d --wait --wait-timeout 120

      - name: Run integration suite (real Postgres + Redis)
        env:
          # DATABASE_URL drives the legacy _REAL_DB_TEST_MODULES (tests/db,
          # tests/test_webhook_duplicate_delivery_stress); PITWALL_TEST_* drives the
          # tests/integration pg_pool/redis_client fixtures. Both point at the same
          # docker-compose infra so the full `-m integration` union runs green.
          DATABASE_URL: postgresql://pitwall:pitwall@127.0.0.1:5444/pitwall_test
          PITWALL_TEST_DATABASE_URL: postgresql://pitwall:pitwall@127.0.0.1:5444/pitwall_test
          PITWALL_TEST_REDIS_URL: redis://127.0.0.1:6380/0
          COVERAGE_FILE: coverage-data/integration.coverage
        run: |
          mkdir -p coverage-data
          # Coverage here feeds the coverage-combined job, which enforces the combined floor.
          uv run pytest -m "integration and not live" -p no:randomly \
            --cov=src/pitwall --cov-report= --cov-fail-under=0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-integration
          path: coverage-data/integration.coverage
          if-no-files-found: error
          retention-days: 7

      - name: Tear down test infrastructure
        if: always()
        run: docker compose -f docker-compose.testinfra.yml down -v

  coverage-combined:
    # Combines the coverage data the test and integration jobs already collected. It runs no suite.
    if: github.event_name == 'schedule'
    needs: [test, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.7"

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.11.19"
          enable-cache: true

      - name: Install frozen dependencies
        run: uv sync --frozen --extra dev

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-hermetic
          path: coverage-data

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-integration
          path: coverage-data

      - name: Combined coverage gate (hermetic + integration, fail-under 77)
        run: |
          uv run coverage combine coverage-data/hermetic.coverage coverage-data/integration.coverage
          uv run coverage report --include="src/**" --show-missing --fail-under=77
          uv run coverage json -o /tmp/coverage.json
          uv run python tools/ci/check_risk_coverage.py /tmp/coverage.json

  required:
    name: CI
    if: always()
    needs:
      - lint
      - format
      - typecheck
      - docs
      - container-build
      - compose-config
      - security-sast
      - security-secrets
      - security-fuzz
      - gateway-catalog-drift
      - test
      - pi-extensions
      - agents-macos
      - integration
    runs-on: ubuntu-latest
    steps:
      - name: Require the normal pull-request checks
        env:
          JOBS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          results = {
              name: details["result"]
              for name, details in json.loads(os.environ["JOBS"]).items()
          }
          print("\n".join(f"{name}: {result}" for name, result in sorted(results.items())))
          failed = [name for name, result in results.items() if result != "success"]
          if failed:
              raise SystemExit(f"required CI jobs failed: {', '.join(sorted(failed))}")
          PY
