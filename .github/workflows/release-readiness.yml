name: Release Readiness

# Release readiness does not repeat CI. It requires a successful ci.yml run for the exact commit,
# then builds and verifies the release artifacts and runs the release journeys.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-succeeded:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$GITHUB_SHA" --limit 50 --json databaseId,event,conclusion)"
          echo "$runs"
          if ! echo "$runs" | jq -e 'any(.[]; .conclusion == "success")' > /dev/null; then
            echo "::error::no successful ci.yml run exists for $GITHUB_SHA; merge through CI before tagging"
            exit 1
          fi

  artifacts:
    needs: ci-succeeded
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: pitwall-rr-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.11.19"
      - run: uv python install 3.14.7
      - run: uv sync --frozen --extra dev
      - name: Validate tag, version, changelog date, release notes, and clean source
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          fi
          uv run python scripts/release/validate_candidate.py --tag "$tag"
      - name: Build twice and prove reproducibility
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          uv build --out-dir dist
          uv build --out-dir reproducibility-check
          for artifact in dist/*; do
            cmp "$artifact" "reproducibility-check/${artifact##*/}"
          done
          rm -rf reproducibility-check
      - name: Validate metadata and archive policy
        run: |
          uv run twine check dist/*
          uv run python scripts/release/inspect_artifacts.py dist
      - name: Clean-install wheel and sdist outside checkout
        env:
          PITWALL_TEST_DATABASE_URL: postgresql://pitwall:pitwall@127.0.0.1:5444/pitwall_test
          PITWALL_TEST_REDIS_URL: redis://127.0.0.1:6380/0
        run: |
          docker compose -f docker-compose.testinfra.yml up -d --wait --wait-timeout 120
          uv run python scripts/release/smoke_artifacts.py dist
      - name: Tear down artifact-smoke infrastructure
        if: always()
        run: docker compose -f docker-compose.testinfra.yml down -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  journeys:
    needs: ci-succeeded
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: pitwall-rr-journeys-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.7"
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.11.19"
          enable-cache: true
      - name: Install frozen dependencies
        run: uv sync --frozen --extra dev
      - name: Start test infrastructure (Postgres + Redis)
        run: docker compose -f docker-compose.testinfra.yml up -d --wait --wait-timeout 120
      - name: Release journeys (explicit release selector; live tests excluded)
        env:
          DATABASE_URL: postgresql://pitwall:pitwall@127.0.0.1:5444/pitwall_test
          PITWALL_TEST_DATABASE_URL: postgresql://pitwall:pitwall@127.0.0.1:5444/pitwall_test
          REDIS_URL: redis://127.0.0.1:6380/0
          PITWALL_TEST_REDIS_URL: redis://127.0.0.1:6380/0
        run: |
          mkdir -p artifacts/release
          uv run pytest -m "release and not live" tests/release -p no:randomly -p no:cov -q \
            --junitxml=artifacts/release/release-tests.xml
      - name: RunPod audit (FATAL --strict) and machine-readable artifact
        run: |
          uv run python -m pitwall.audit.checks --strict
          uv run python -m pitwall.audit.checks --json > artifacts/release/runpod-audit.json
      - name: Upload release journey evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-journey-evidence
          path: artifacts/release/
          if-no-files-found: warn
      - name: Tear down test infrastructure
        if: always()
        run: docker compose -f docker-compose.testinfra.yml down -v
