; submeter ESP32 firmware — AITRIP/Hosyond/MELIFE 4.0" 320x480 board
; MCU: ESP32-WROOM-32E (classic LX6, 4 MB flash, NO PSRAM) — family: ESP32-3248S035 (CYD)
; Display: ST7796S 320x480 on HSPI (VERIFIED §11.4 — TFT_BL=27, CH340 bridge).
; Touch:   XPT2046 resistive on the SHARED display HSPI bus (SCLK14/MOSI13/MISO12) — only CS is
;          separate (-DTOUCH_CS=33). NOT a second SPI bus. Touch calibration is baked into each
;          sketch as TOUCH_CAL = {263, 3547, 293, 3586, 4} at setRotation(0) (captured on this board).
;
; The §9 display config is carried as TFT_eSPI build flags (no hand-edited User_Setup.h).
; Two bring-up environments share the [env] base; pick one:
;   pio run -e display -t upload   # §11.4 R/G/B + text   (src/main.cpp)        [PASSED]
;   pio run -e touch   -t upload   # §11.6 touch coords    (src/touch_test.cpp)

[platformio]
default_envs = meter

[env]
platform = espressif32
board = esp32dev            ; plain WROOM-32 == our ESP32-WROOM-32E (N4)
framework = arduino
monitor_speed = 115200
upload_speed = 921600       ; drop to 460800 if uploads are flaky over CH340
build_flags =
    -DUSER_SETUP_LOADED=1
    ; --- driver / panel (HANDOFF §9) ---
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DUSE_HSPI_PORT=1        ; integrated CYD boards drive the LCD on HSPI
    ; --- LCD pins (HSPI) ---
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=27            ; backlight 27 — VERIFIED working at §11.4
    -DTFT_BACKLIGHT_ON=1
    ; --- SPI speeds ---
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    ; --- fonts ---
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSMOOTH_FONT=1

[env:display]
build_src_filter = -<*> +<main.cpp>
lib_deps = bodmer/TFT_eSPI@^2.5.43

[env:touch]
build_src_filter = -<*> +<touch_test.cpp>
; Touch SHARES the display HSPI bus on the 3248S035 (SCLK14/MOSI13/MISO12); only CS is separate.
; So TFT_eSPI's built-in XPT2046 driver handles it — just point it at the touch CS pin.
build_flags = ${env.build_flags} -DTOUCH_CS=33
lib_deps = bodmer/TFT_eSPI@^2.5.43

[env:meter]
; the real app (§8/§11.7): WiFi -> poll aggregator /usage -> render provider cards. Touch enabled
; (TOUCH_CS=33, calibrated) for future paging/detail screens. Needs src/secrets.h (see secrets.example.h).
build_src_filter = -<*> +<meter.cpp>
build_flags = ${env.build_flags} -DTOUCH_CS=33
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.2.0

[env:ledsweep]
; §9a one-off: light candidate RGB-LED pins one at a time to map pin->color and confirm polarity.
build_src_filter = -<*> +<ledsweep.cpp>
lib_deps =
