# Local Postgres and Redis for development, tests, and the README quick start. Bound to 127.0.0.1 only.
# Tests reach them at DATABASE_URL=postgresql://...:5444 and REDIS_URL=redis://...:6380.
#
#   docker compose -f docker-compose.testinfra.yml up -d
#   docker compose -f docker-compose.testinfra.yml down       (preserve volumes)
#   docker compose -f docker-compose.testinfra.yml down -v    (nuke volumes)

services:
  postgres:
    image: postgres:16@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
    restart: unless-stopped
    environment:
      POSTGRES_USER: pitwall
      POSTGRES_PASSWORD: pitwall
      POSTGRES_DB: pitwall_test
    ports:
      - "127.0.0.1:${PITWALL_TEST_POSTGRES_PORT:-5444}:5432"
    volumes:
      - pitwall-test-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitwall -d pitwall_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${PITWALL_TEST_REDIS_PORT:-6380}:6379"
    volumes:
      - pitwall-test-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pitwall-test-pg: {}
  pitwall-test-redis: {}
